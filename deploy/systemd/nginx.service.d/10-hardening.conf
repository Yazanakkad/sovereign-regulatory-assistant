# Sandbox for the Ubuntu nginx.service; the packaged unit is left untouched.
# Source of truth: deploy/systemd/nginx.service.d/10-hardening.conf in the repo.
# Installed as a root-owned copy in /etc/systemd/system/nginx.service.d/.
# The master runs as root with the capabilities below; workers run as www-data.

[Service]
# Capabilities the master keeps; all others are removed for good:
#   NET_BIND_SERVICE  bind port 443
#   SETUID, SETGID    start workers as www-data
#   KILL              signal workers owned by another user (reload, stop)
#   DAC_OVERRIDE      open log files owned by www-data:adm 0640 as root
#   CHOWN             hand reopened logs and temp directories to www-data
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_KILL CAP_DAC_OVERRIDE CAP_CHOWN
NoNewPrivileges=yes

# Filesystem: read-only except logs, temp files and the PID file.
# /run is writable because the packaged config puts the PID file at /run/nginx.pid.
ProtectSystem=strict
ReadWritePaths=/var/log/nginx /var/lib/nginx /run
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes

# Kernel and system interfaces.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes

# Sockets: IPv4, IPv6 and local only.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# System calls: the standard service set; blocked calls fail with EPERM.
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
