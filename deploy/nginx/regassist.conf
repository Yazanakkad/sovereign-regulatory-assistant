# Nginx site for regassist: TLS termination and reverse proxy to the app.
# Source of truth: deploy/nginx/regassist.conf in the repo.
# Installed as a root-owned copy: /etc/nginx/sites-available/regassist,
# enabled by a symlink in /etc/nginx/sites-enabled/. Decisions: ADR-0012.

# JSON access log (http context). The path is logged without the query
# string ($uri, not $request_uri): query strings can carry personal data.
log_format regassist_json escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"client":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"tls":"$ssl_protocol",'
    '"user_agent":"$http_user_agent"}';

# Catch-all: any TLS connection whose SNI is not our name (bare IP,
# wrong host name, no SNI) is rejected during the handshake.
# Part of the handshake is negotiated with this default server's settings
# before SNI selects a server, so the TLS policy is identical in both blocks.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name regassist-srv01.mshome.net;

    server_tokens off;

    # Leaf certificate signed by the local dev CA; key is root-only.
    ssl_certificate     /etc/nginx/tls/regassist-srv01.crt;
    ssl_certificate_key /etc/nginx/tls/regassist-srv01.key;

    # Mozilla "intermediate": TLS 1.2 and 1.3; for TLS 1.2 only forward-secret
    # AEAD suites (ssl_ciphers does not affect TLS 1.3 suites). Key-exchange
    # groups stay on the OpenSSL default, which includes X25519MLKEM768.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/regassist.access.log regassist_json;

    # Security headers. Keep every add_header in this block: a location that
    # declares its own add_header drops all headers inherited from here.
    # "always" adds them to error responses too.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Request-ID              $request_id always;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Nginx is the edge: overwrite client-supplied forwarding headers
        # instead of appending to them, so clients cannot spoof their address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
