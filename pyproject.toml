[project]
name = "regassist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yazan Alaqqad", email = "102602315+Yazanakkad@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
regassist = "regassist:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
